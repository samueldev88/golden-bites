{% extends "painel/base.html" %}
{% block titulo %}Remover {{ singular }}{% endblock %}
{% block conteudo %}
<div class="p-caixa p-confirma">
  <h1>Remover {{ singular }}?</h1>
  <p><strong>{{ object }}</strong> será removido. Pedidos já feitos continuam guardados.</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn perigo">Sim, remover</button>
    <a href="{{ url_voltar }}">Cancelar</a>
  </form>
</div>
{% endblock %}
